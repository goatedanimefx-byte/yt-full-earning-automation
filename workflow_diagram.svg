<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#3b82f6"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="700" fill="#0f172a"/>
  
  <!-- Title -->
  <text x="450" y="40" font-family="Arial Black" font-size="24" fill="#f8fafc" text-anchor="middle">DOCUMENTARY ENGINE WORKFLOW</text>
  
  <!-- START -->
  <rect x="350" y="60" width="200" height="50" rx="25" fill="#22c55e" filter="url(#shadow)"/>
  <text x="450" y="92" font-family="Arial" font-size="16" fill="#fff" text-anchor="middle">User Triggers Run</text>
  
  <!-- Arrow -->
  <path d="M450 110 L450 140" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Script Gen -->
  <rect x="325" y="150" width="250" height="50" rx="8" fill="#3b82f6" filter="url(#shadow)"/>
  <text x="450" y="182" font-family="Arial" font-size="14" fill="#fff" text-anchor="middle">Generate Script (Template)</text>
  
  <!-- Arrow -->
  <path d="M450 200 L450 230" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Voice Gen -->
  <rect x="325" y="240" width="250" height="50" rx="8" fill="#8b5cf6" filter="url(#shadow)"/>
  <text x="450" y="272" font-family="Arial" font-size="14" fill="#fff" text-anchor="middle">Generate Voice (Kitten TTS)</text>
  
  <!-- Arrow -->
  <path d="M450 290 L450 320" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Visuals Decision -->
  <rect x="300" y="330" width="300" height="60" rx="10" fill="#f59e0b" filter="url(#shadow)"/>
  <text x="450" y="352" font-family="Arial" font-size="14" fill="#fff" text-anchor="middle">Can Generate Visuals via Code?</text>
  <text x="450" y="372" font-family="Arial" font-size="11" fill="#fef3c7" text-anchor="middle">(Three.js / Blender)</text>
  
  <!-- Yes branch -->
  <path d="M450 390 L450 420 L280 420 L280 450" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="365" y="415" font-family="Arial" font-size="12" fill="#22c55e">Yes</text>
  
  <!-- Code Generated -->
  <rect x="130" y="460" width="200" height="50" rx="8" fill="#06b6d4" filter="url(#shadow)"/>
  <text x="230" y="492" font-family="Arial" font-size="14" fill="#fff" text-anchor="middle">Code Generated</text>
  
  <!-- No branch -->
  <path d="M600 360 L700 360 L700 420 L700 450" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="655" y="415" font-family="Arial" font-size="12" fill="#ef4444">No</text>
  
  <!-- Pexels -->
  <rect x="600" y="460" width="200" height="50" rx="8" fill="#ec4899" filter="url(#shadow)"/>
  <text x="700" y="492" font-family="Arial" font-size="14" fill="#fff" text-anchor="middle">Fetch from Pexels</text>
  
  <!-- Merge -->
  <path d="M330 510 L330 530 L450 530 L450 560" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M700 510 L700 530 L550 530 L500 530 L500 560" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Show User -->
  <rect x="325" y="570" width="250" height="50" rx="8" fill="#f59e0b" filter="url(#shadow)"/>
  <text x="450" y="602" font-family="Arial" font-size="14" fill="#fff" text-anchor="middle">Show Preview to User</text>
  
  <!-- Arrow -->
  <path d="M450 620 L450 650" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Approval Decision -->
  <rect x="300" y="660" width="300" height="50" rx="10" fill="#64748b" filter="url(#shadow)"/>
  <text x="450" y="690" font-family="Arial" font-size="14" fill="#fff" text-anchor="middle">User Approves?</text>
  
  <!-- Labels -->
  <text x="50" y="680" font-family="Arial" font-size="11" fill="#94a3b8">Legend:</text>
  <rect x="50" y="690" width="15" height="15" fill="#22c55e" rx="3"/>
  <text x="70" y="703" font-family="Arial" font-size="10" fill="#94a3b8">Start</text>
  <rect x="120" y="690" width="15" height="15" fill="#3b82f6" rx="3"/>
  <text x="140" y="703" font-family="Arial" font-size="10" fill="#94a3b8">Process</text>
  <rect x="200" y="690" width="15" height="15" fill="#f59e0b" rx="3"/>
  <text x="220" y="703" font-family="Arial" font-size="10" fill="#94a3b8">Decision</text>
</svg>